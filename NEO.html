<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEO LIMIT PROPERTY — Real Estate Brokerage & Property Advisory</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    /* ── NEO LIMIT PROPERTY brand ── navy #0A1F44 + gold #C9A35F ── */
    --navy: #0A1F44;
    --navy-2: #0F2A5C;
    --navy-deep: #051028;
    --gold-brand: #C9A35F;
    --gold-brand-2: #B08B47;

    --bg: #06112B;
    --bg-2: #0A1A3C;
    --surface: #0F2148;
    --surface-2: #16295A;
    --border: #1F3268;
    --border-strong: #2C4385;
    --text: #F5F2E8;
    --text-2: #B6BED5;
    --text-3: #7A85A3;
    --primary: #C9A35F;          /* brand gold — NEO Limit signature */
    --primary-soft: rgba(201,163,95,.14);
    --primary-dark: #B08B47;
    --primary-tint: rgba(201,163,95,.06);
    --accent: #C9A35F;
    --accent-soft: rgba(201,163,95,.16);
    --accent-dark: #A8854B;
    --gold: #C9A35F;
    --gold-soft: rgba(201,163,95,.18);
    --success: #4DD09E;
    --success-soft: rgba(77,208,158,.15);
    --warning: #E0B864;
    --danger: #FF6B6B;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-xl: 20px;
    --r-2xl: 28px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 1px 1px rgba(0,0,0,.3);
    --shadow-md: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    --shadow-lg: 0 12px 36px rgba(0,0,0,.4);
    --shadow-glow: 0 0 40px rgba(201,163,95,.22);
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter','Helvetica Neue',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.011em;
  }
  h1,h2,h3 { letter-spacing: -0.028em; }
  body { background-image:
    radial-gradient(circle at 90% 0%, rgba(201,163,95,.06) 0%, transparent 35%),
    radial-gradient(circle at 0% 100%, rgba(201,163,95,.04) 0%, transparent 40%);
  }
  .num { font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -0.02em; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease; }
  .card:hover { border-color: var(--border-strong); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; font-size: 14px; border-radius: 999px; transition: all .18s ease; padding: 11px 22px; letter-spacing: -0.01em; }
  .btn-primary { background: var(--primary); color: #0A1F44; box-shadow: 0 0 0 1px var(--primary) inset, 0 8px 24px rgba(201,163,95,.18); font-weight: 600; }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 0 0 1px var(--primary-dark) inset, 0 12px 32px rgba(201,163,95,.28); }
  .btn-cta { background: var(--primary); color: #0A1F44; font-weight: 600; box-shadow: 0 8px 24px rgba(201,163,95,.18); }
  .btn-cta:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 12px 32px rgba(201,163,95,.3); }
  .btn-secondary { background: transparent; border: 1px solid var(--border-strong); color: var(--text); }
  .btn-secondary:hover { background: var(--surface-2); border-color: var(--text-3); }
  .btn-ghost { background: transparent; color: var(--text-2); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
  .input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; font-size: 14px; width: 100%; color: var(--text); transition: border-color .15s, box-shadow .15s; }
  .input::placeholder { color: var(--text-3); }
  .input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(201,163,95,.1); }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; letter-spacing: -0.005em; }
  .pill-new { background: var(--accent-soft); color: var(--accent); }
  .pill-drop { background: var(--success-soft); color: var(--success); }
  .pill-hot { background: var(--gold-soft); color: var(--gold); }
  .pill-free { background: var(--success-soft); color: var(--success); }
  .pill-info { background: var(--primary-soft); color: var(--primary); }
  .pill-gold { background: var(--gold-soft); color: var(--gold); }
  .pill-verified { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .pill-reserved { background: var(--gold-soft); color: var(--gold); }
  .pill-sold { background: var(--surface-2); color: var(--text-2); }

  .stars { color: var(--gold); display: inline-flex; gap: 1px; font-size: 12px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .screen:not(.active) { display: none !important; }

  /* Map */
  .map-shell { position: relative; border-radius: inherit; overflow: visible; }
  .map-bg {
    background:
      radial-gradient(circle at 22% 28%, rgba(201,163,95,.08) 0%, transparent 24%),
      radial-gradient(circle at 72% 58%, rgba(201,163,95,.05) 0%, transparent 30%),
      radial-gradient(circle at 50% 82%, rgba(10,31,68,.06) 0%, transparent 26%),
      linear-gradient(135deg, #08163A 0%, #0F2148 100%);
    position: absolute; inset: 0; overflow: hidden; border-radius: inherit;
  }
  .map-bg::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(201,163,95,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,163,95,.06) 1px, transparent 1px);
    background-size: 36px 36px;
    pointer-events: none;
  }
  .map-bg::after {
    content: ""; position: absolute; top: -10%; left: 30%; width: 8%; height: 130%;
    background: linear-gradient(180deg, transparent 0%, rgba(110,116,128,.25) 15%, rgba(110,116,128,.3) 85%, transparent 100%);
    transform: rotate(18deg);
    pointer-events: none;
  }
  .map-label { position: absolute; font-size: 10px; font-weight: 600; color: rgba(245,244,238,.3); text-transform: uppercase; letter-spacing: .1em; pointer-events: none; font-family: ui-monospace, 'SF Mono', monospace; }

  /* District zone polygons */
  .map-zones { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
  .map-zone {
    fill: rgba(201,163,95,.04);
    stroke: rgba(201,163,95,.22);
    stroke-width: .35;
    stroke-dasharray: 1.2 1.2;
    cursor: pointer;
    transition: fill .18s ease, stroke .18s ease, opacity .18s ease;
    vector-effect: non-scaling-stroke;
  }
  .map-zone:hover { fill: rgba(201,163,95,.12); stroke: rgba(201,163,95,.55); stroke-dasharray: none; }
  .map-zone.selected { fill: rgba(201,163,95,.18); stroke: var(--primary); stroke-dasharray: none; stroke-width: .6; }
  .map-zone.dim { opacity: .25; }
  .map-zone.empty { fill: rgba(110,116,128,.04); stroke: rgba(110,116,128,.15); cursor: default; }
  .map-zone-label {
    position: absolute; transform: translate(-50%,-50%);
    pointer-events: none;
    text-align: center;
    z-index: 2;
    transition: opacity .18s ease;
  }
  .map-zone-name {
    font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: rgba(245,244,238,.55);
    font-family: ui-monospace, 'SF Mono', monospace;
  }
  .map-zone-meta {
    font-size: 10px; color: rgba(245,244,238,.45); margin-top: 2px;
  }
  .map-zone-label.selected .map-zone-name { color: var(--primary); }
  .map-zone-label.selected .map-zone-meta { color: var(--primary); }
  .map-zone-label.dim { opacity: .4; }

  /* Listing pin */
  .map-pin-wrap { position: absolute; transform: translate(-50%,-50%); z-index: 3; }
  .map-pin-wrap.hover { z-index: 50; }
  .map-pin {
    position: relative; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text);
    padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; box-shadow: 0 4px 12px rgba(0,0,0,.4);
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .map-pin:hover { transform: scale(1.08); border-color: var(--primary); }
  .map-pin.selected { background: var(--primary); color: #0A1F44; border-color: var(--primary); box-shadow: 0 4px 14px rgba(201,163,95,.45); }
  .map-pin.viewed { color: var(--text-3); opacity: .7; }
  .map-pin.cta { background: var(--accent); color: #fff; border-color: var(--accent); }
  @keyframes pin-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .map-pin.selected { animation: pin-pulse 1.4s ease-in-out infinite; }

  /* Pin hover tooltip — detailed listing card */
  .map-pin-tip {
    position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%) translateY(6px);
    width: 240px;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 18px 48px rgba(0,0,0,.55);
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
    color: var(--text);
    z-index: 100;
  }
  .map-pin-wrap.hover .map-pin-tip { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .map-pin-tip::after {
    content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: var(--border-strong);
  }
  /* Flip tooltip to below the pin (for pins near map top) */
  .map-pin-wrap.tip-below .map-pin-tip { bottom: auto; top: calc(100% + 10px); transform: translateX(-50%) translateY(-6px); }
  .map-pin-wrap.tip-below.hover .map-pin-tip { transform: translateX(-50%) translateY(0); }
  .map-pin-wrap.tip-below .map-pin-tip::after { top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: var(--border-strong); }
  /* Anchor tooltip to right/left of the pin (for pins near horizontal edges) */
  .map-pin-wrap.tip-right .map-pin-tip { left: 0; transform: translateX(-16px) translateY(6px); }
  .map-pin-wrap.tip-right.hover .map-pin-tip { transform: translateX(-16px) translateY(0); }
  .map-pin-wrap.tip-right .map-pin-tip::after { left: 24px; transform: none; }
  .map-pin-wrap.tip-left .map-pin-tip { left: auto; right: 0; transform: translateX(16px) translateY(6px); }
  .map-pin-wrap.tip-left.hover .map-pin-tip { transform: translateX(16px) translateY(0); }
  .map-pin-wrap.tip-left .map-pin-tip::after { left: auto; right: 24px; transform: none; }
  .map-pin-tip-photo {
    position: relative; height: 110px; background-size: cover; background-position: center;
  }
  .map-pin-tip-body { padding: 10px 12px 12px; }
  .map-pin-tip-price { font-size: 16px; font-weight: 700; color: var(--primary); }
  .map-pin-tip-title { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .map-pin-tip-meta { font-size: 11px; color: var(--text-2); margin-top: 4px; }
  .map-pin-tip-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .map-pin-tip-agent { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .map-pin-tip-avatar { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg,#0A1F44,#051028); color:#fff; font-size: 9px; font-weight: 600; display:inline-flex; align-items:center; justify-content:center; }
  .map-pin-tip-agentname { font-size: 11px; color: var(--text-2); }
  .map-pin-tip-cta {
    margin-top: 10px; width: 100%; padding: 7px 0; border-radius: 8px;
    background: var(--primary); color: #0A1F44; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background .15s ease;
  }
  .map-pin-tip-cta:hover { background: var(--primary-dark); }

  /* Zone price summary panel (floating on map when district selected) */
  .zone-summary {
    position: absolute; top: 12px; left: 12px; right: 12px;
    background: rgba(8,22,58,.92); backdrop-filter: blur(10px);
    border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 12px 14px; z-index: 40;
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
    color: var(--text);
  }
  .zone-summary-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .zone-summary-title { font-size: 13px; font-weight: 600; display:flex; align-items:center; gap:6px; }
  .zone-summary-close { color: var(--text-3); cursor: pointer; }
  .zone-summary-close:hover { color: var(--text); }
  .zone-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 11px; }
  .zone-summary-stat { background: rgba(255,255,255,.03); padding: 6px 8px; border-radius: 8px; }
  .zone-summary-stat-label { color: var(--text-3); font-size: 10px; }
  .zone-summary-stat-val { font-weight: 700; color: var(--primary); margin-top: 1px; }
  .zone-summary-list {
    margin-top: 10px; max-height: 200px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zone-summary-row {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.03); padding: 6px 8px; border-radius: 8px;
    cursor: pointer; transition: background .15s ease;
  }
  .zone-summary-row:hover { background: rgba(201,163,95,.08); }
  .zone-summary-row-thumb { width: 36px; height: 36px; border-radius: 6px; background-size: cover; background-position: center; flex-shrink: 0; }
  .zone-summary-row-body { flex: 1; min-width: 0; }
  .zone-summary-row-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone-summary-row-meta { font-size: 10px; color: var(--text-3); margin-top: 1px; }
  .zone-summary-row-price { font-size: 12px; font-weight: 700; color: var(--primary); }

  /* Heart */
  .heart-btn { background: rgba(22,26,33,.85); backdrop-filter: blur(8px); width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; transition: transform .15s; box-shadow: 0 2px 8px rgba(0,0,0,.3); color: var(--text); border: 1px solid var(--border); }
  .heart-btn:hover { transform: scale(1.08); color: var(--accent); border-color: var(--accent); }
  .heart-btn.saved { color: var(--accent); border-color: var(--accent); }
  .heart-btn.saved svg { fill: var(--accent); color: var(--accent); }
  @keyframes heart-pop { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .heart-btn.pop { animation: heart-pop .35s ease; }

  /* Photo gallery */
  .gallery-grid { display: grid; gap: 4px; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; height: 380px; border-radius: 12px; overflow: hidden; }
  @media (max-width: 640px) { .gallery-grid { height: 260px; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; } .gallery-grid > :first-child { grid-column: span 2; } .gallery-grid > :nth-child(n+4) { display: none; } }
  .gallery-grid > :first-child { grid-row: 1 / span 2; }
  .gallery-tile { background-size: cover; background-position: center; cursor: pointer; transition: opacity .15s; position: relative; }
  .gallery-tile:hover { opacity: .92; }

  /* Mode toggle (Түрээс/Зарах) */
  .mode-toggle { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 0; border: 1px solid var(--border); }
  .mode-toggle button { padding: 7px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text-2); transition: all .18s ease; }
  .mode-toggle button.active { background: var(--primary); color: #0A1F44; font-weight: 600; }

  /* Sticky header — modern dark glass */
  .header-sticky {
    position: sticky; top: 0; z-index: 30;
    background: rgba(10,31,68,.7);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--border);
  }

  /* Ticker animation */
  @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .ticker-track { display: flex; gap: 4rem; animation: ticker 40s linear infinite; white-space: nowrap; }
  .ticker-track > * { flex-shrink: 0; }

  /* Subtle scanline / grid texture */
  .grid-texture {
    background-image:
      linear-gradient(rgba(201,163,95,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,163,95,.04) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Marquee badge */
  .badge-glow { position: relative; }
  .badge-glow::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(135deg, rgba(201,163,95,.6), transparent 50%); mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }

  /* Mobile bottom tab */
  .bottom-tab { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,31,68,.92); backdrop-filter: blur(16px); border-top: 1px solid var(--border); display: flex; z-index: 40; padding: 6px 0 calc(env(safe-area-inset-bottom, 0px) + 6px); }
  .bottom-tab a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--text-3); font-size: 10px; font-weight: 500; cursor: pointer; }
  .bottom-tab a.active { color: var(--primary); }
  @media (min-width: 1024px) { .bottom-tab { display: none; } }
  @media (max-width: 1024px) { body main { padding-bottom: 80px; } }

  /* Demo pill */
  .demo-pill { position: fixed; bottom: 16px; right: 16px; z-index: 50; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: flex; gap: 2px; padding: 6px; max-width: calc(100vw - 32px); overflow-x: auto; }
  .demo-pill::-webkit-scrollbar { display: none; }
  .demo-pill button { width: 36px; height: 36px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); transition: all .12s; flex-shrink: 0; position: relative; }
  .demo-pill button:hover { background: var(--surface-2); color: var(--text); }
  .demo-pill button.active { background: var(--primary); color: #0A1F44; }
  .demo-pill button:hover .tip { opacity: 1; transform: translate(-50%,-44px); }
  .tip { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%,-36px); background: #1A1A1A; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 4px; opacity: 0; pointer-events: none; transition: all .15s; white-space: nowrap; }
  @media (max-width: 1024px) { .demo-pill { bottom: 76px; } }

  /* Toast */
  .toast-wrap { position: fixed; bottom: 80px; right: 16px; z-index: 90; display: flex; flex-direction: column; gap: 10px; max-width: calc(100vw - 32px); width: 340px; pointer-events: none; }
  .toast { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); display: flex; align-items: flex-start; gap: 10px; animation: toastIn .22s ease; pointer-events: auto; }
  .toast.success { border-left: 4px solid var(--success); }
  .toast.info { border-left: 4px solid var(--primary); }
  .toast.warning { border-left: 4px solid var(--warning); }
  @keyframes toastIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @media (max-width: 1024px) { .toast-wrap { bottom: 90px; right: 12px; left: 12px; width: auto; } }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); z-index: 80; display: none; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; }
  .modal-backdrop.open { display: flex; }
  .modal-backdrop { transition: opacity .22s ease, backdrop-filter .22s ease; opacity: 0; }
  .modal-backdrop.open { opacity: 1; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.5); width: 100%; max-width: 480px; animation: modalIn .28s cubic-bezier(.22,1,.36,1); color: var(--text); }
  .modal.lg { max-width: 720px; }
  .modal.xl { max-width: 1040px; }

  /* Detailed stats modal */
  .stats-tab { padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-3); transition: background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease; white-space: nowrap; }
  .stats-tab:hover { color: var(--text); border-color: var(--text-3); transform: translateY(-1px); }
  .stats-tab:active { transform: translateY(0); }
  .stats-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  body[data-theme="warm"] .stats-tab.active { background: var(--gold-brand); color: #0A1F44; border-color: var(--gold-brand); }
  .stats-kpi { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; opacity: 0; transform: translateY(8px); animation: statsFadeUp .5s cubic-bezier(.22,1,.36,1) forwards; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
  .stats-kpi:hover { transform: translateY(-2px); border-color: var(--gold-brand); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .stats-kpi:nth-child(1) { animation-delay: .04s; }
  .stats-kpi:nth-child(2) { animation-delay: .12s; }
  .stats-kpi:nth-child(3) { animation-delay: .20s; }
  .stats-kpi:nth-child(4) { animation-delay: .28s; }
  .stats-kpi-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .stats-kpi-val { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.1; }
  .stats-kpi-delta { font-size: 11px; font-weight: 600; margin-top: 4px; }
  .stats-kpi-delta.up { color: var(--success); }
  .stats-kpi-delta.down { color: #C44545; }
  .stats-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; opacity: 0; transform: translateY(10px); animation: statsFadeUp .55s cubic-bezier(.22,1,.36,1) .18s forwards; }
  .stats-card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .stats-card-sub { font-size: 11px; color: var(--text-3); margin-bottom: 12px; }
  .stats-bar-row { display: grid; grid-template-columns: 96px 1fr 64px; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px; }
  .stats-bar-track { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .stats-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--gold-brand)); border-radius: 999px; width: 0; animation: statsBarGrow .9s cubic-bezier(.22,1,.36,1) .25s forwards; transition: filter .2s ease; }
  .stats-bar-fill:hover { filter: brightness(1.1); }
  .stats-trend-bar { flex: 1; border-radius: 3px 3px 0 0; background: linear-gradient(180deg, var(--gold-brand), var(--primary)); position: relative; min-height: 3px; cursor: pointer; transform-origin: bottom; transform: scaleY(0); animation: statsTrendRise .7s cubic-bezier(.22,1,.36,1) forwards; transition: opacity .2s ease, filter .2s ease; }
  .stats-trend-bar:hover { opacity: .9; filter: brightness(1.12); }
  .stats-trend-bar.current { background: linear-gradient(180deg, var(--gold-brand), #B08B47); }
  .stats-trend-bar:nth-child(1)  { animation-delay: .25s; }
  .stats-trend-bar:nth-child(2)  { animation-delay: .29s; }
  .stats-trend-bar:nth-child(3)  { animation-delay: .33s; }
  .stats-trend-bar:nth-child(4)  { animation-delay: .37s; }
  .stats-trend-bar:nth-child(5)  { animation-delay: .41s; }
  .stats-trend-bar:nth-child(6)  { animation-delay: .45s; }
  .stats-trend-bar:nth-child(7)  { animation-delay: .49s; }
  .stats-trend-bar:nth-child(8)  { animation-delay: .53s; }
  .stats-trend-bar:nth-child(9)  { animation-delay: .57s; }
  .stats-trend-bar:nth-child(10) { animation-delay: .61s; }
  .stats-trend-bar:nth-child(11) { animation-delay: .65s; }
  .stats-trend-bar:nth-child(12) { animation-delay: .69s; }
  .stats-pie-legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); }
  .stats-pie-dot { width: 10px; height: 10px; border-radius: 3px; }
  .stats-pie { animation: statsPieIn .8s cubic-bezier(.22,1,.36,1) .25s both; }
  @keyframes modalIn { from { transform: translateY(20px) scale(.96); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes statsFadeUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes statsBarGrow { from { width: 0; } to { width: var(--bar-w, 0); } }
  @keyframes statsTrendRise { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
  @keyframes statsPieIn { from { transform: scale(.6) rotate(-90deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes statsNumberPop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .stats-kpi-val { animation: statsNumberPop .4s cubic-bezier(.22,1,.36,1) .25s both; }
  @media (prefers-reduced-motion: reduce) {
    .stats-kpi, .stats-card, .stats-bar-fill, .stats-trend-bar, .stats-pie, .stats-kpi-val { animation: none !important; opacity: 1 !important; transform: none !important; }
    .stats-bar-fill { width: var(--bar-w, 0) !important; }
  }

  /* Command palette */
  .cmd-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(6px); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding-top: 10vh; padding-left: 16px; padding-right: 16px; }
  .cmd-backdrop.open { display: flex; }
  .cmd { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 28px 72px rgba(0,0,0,.5); width: 100%; max-width: 560px; overflow: hidden; }
  .cmd-input-wrap { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .cmd-input { flex: 1; border: 0; outline: none; font-size: 15px; background: transparent; color: var(--text); }
  .cmd-input::placeholder { color: var(--text-3); }
  .cmd-list { max-height: 360px; overflow-y: auto; padding: 8px; }
  .cmd-group-title { padding: 8px 12px 4px; font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
  .cmd-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text); }
  .cmd-item.selected { background: var(--primary-soft); color: var(--primary); }
  .cmd-kbd { font-size: 11px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--text-3); font-family: ui-monospace, monospace; }

  /* Chip */
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 4px 4px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 500; }
  .chip-x { width: 18px; height: 18px; border-radius: 50%; background: rgba(10,31,68,.18); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .chip-x:hover { background: rgba(10,31,68,.3); }

  .filter-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: 14px; }
  .filter-row input { accent-color: var(--primary); }
  .filter-row .count { color: var(--text-3); margin-left: auto; font-size: 12px; }

  .src-chip { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; text-align: center; cursor: pointer; transition: all .12s; background: var(--surface); color: var(--text); user-select: none; }
  .src-chip:hover { background: var(--surface-2); }
  .src-chip.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 500; }

  .step-num { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .step-num.done { background: var(--primary); color: #0A1F44; }
  .step-num.current { background: var(--primary); color: #0A1F44; box-shadow: 0 0 0 4px var(--primary-soft); }
  .step-num.todo { background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border); }
  .step-line { flex: 1; height: 2px; background: var(--border); }
  .step-line.done { background: var(--primary); }

  .otp-box { width: 44px; height: 52px; text-align: center; font-size: 22px; font-weight: 600; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  .otp-box:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10,31,68,.1); }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Property card on results page */
  .prop-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; cursor: pointer; transition: transform .2s ease, box-shadow .25s ease, border-color .2s ease; }
  .prop-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(201,163,95,.2), 0 16px 40px rgba(0,0,0,.4); }
  .prop-card.highlighted { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(201,163,95,.4); }
  .prop-card .photo { aspect-ratio: 16/11; background-size: cover; background-position: center; position: relative; transition: transform .4s ease; }
  .prop-card:hover .photo { transform: scale(1.03); }
  .prop-card .photo-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; }
  .prop-card .photo-dots span { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.5); }
  .prop-card .photo-dots span.active { background: var(--primary); width: 16px; border-radius: 3px; }
  .prop-card .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.3) 0%, transparent 30%, transparent 60%, rgba(0,0,0,.5) 100%); pointer-events: none; }

  /* ============== Theme: Warm (light) override — NEO Limit ivory + navy ============== */
  body[data-theme="warm"] {
    --bg: #F7F4EC;
    --bg-2: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F0EAD9;
    --border: #E4DDC9;
    --border-strong: #C9BE9F;
    --text: #0A1F44;
    --text-2: #4A5874;
    --text-3: #8A93A8;
    background-image:
      radial-gradient(circle at 90% 0%, rgba(201,163,95,.08) 0%, transparent 35%),
      radial-gradient(circle at 0% 100%, rgba(10,31,68,.05) 0%, transparent 40%);
  }
  body[data-theme="warm"] .header-sticky { background: rgba(255,253,247,.88); border-bottom-color: var(--border); }
  body[data-theme="warm"] .map-pin { background: #fff; color: var(--text); border-color: var(--border-strong); }
  body[data-theme="warm"] .map-label { color: rgba(10,31,68,.4); }
  body[data-theme="warm"] .map-bg { background: linear-gradient(135deg, #F0EAD9 0%, #E4DDC9 100%); }
  body[data-theme="warm"] .map-bg::before { background-image: linear-gradient(rgba(10,31,68,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(10,31,68,.05) 1px, transparent 1px); }
  body[data-theme="warm"] .heart-btn { background: rgba(255,255,255,.95); border-color: var(--border); color: var(--text-2); }
  body[data-theme="warm"] .modal { background: #fff; }
  body[data-theme="warm"] .cmd { background: #fff; }
  body[data-theme="warm"] .bottom-tab { background: rgba(255,253,247,.95); }
  body[data-theme="warm"] .input { background: #fff; }

  /* === Warm-mode fixes for dark-locked panels ===
     Hero/stats-panel/footer are hard-locked to dark backgrounds, so in warm mode
     we redefine --text, --text-2, --text-3 *within their scope* to cream tones.
     Everything inside picks up the inverted palette automatically — no selector chasing. */
  body[data-theme="warm"] .bm-hero,
  body[data-theme="warm"] .bm-stats-panel,
  body[data-theme="warm"] .bm-footer {
    --text:   #F5F2E8;
    --text-2: rgba(245,242,232,.82);
    --text-3: rgba(245,242,232,.6);
    --surface:   rgba(255,255,255,.05);   /* override outer #FFFFFF — hero cards on dark */
    --surface-2: rgba(255,255,255,.08);
    --border:        rgba(255,255,255,.12);
    --border-strong: rgba(255,255,255,.22);
  }
  /* Category tabs container — dark glass */
  body[data-theme="warm"] .bm-hero .bm-cattabs {
    background: rgba(255,255,255,.05);
    border-color: rgba(255,255,255,.12);
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  body[data-theme="warm"] .bm-cattab { color: rgba(245,242,232,.78); }
  body[data-theme="warm"] .bm-cattab:hover { background: rgba(255,255,255,.06); color: #F5F2E8; }
  body[data-theme="warm"] .bm-cattab.active { color: var(--gold-brand); border-bottom-color: var(--gold-brand); }
  body[data-theme="warm"] .bm-cattab.active i { color: var(--gold-brand); }
  /* Mega search bar — dark glass on warm hero */
  body[data-theme="warm"] .bm-hero .bm-search-mega {
    background: rgba(255,255,255,.05);
    border-color: rgba(255,255,255,.14);
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
  body[data-theme="warm"] .bm-hero .bm-search-mega input { color: #F5F2E8; }
  body[data-theme="warm"] .bm-hero .bm-search-mega input::placeholder { color: rgba(245,242,232,.55); }
  body[data-theme="warm"] .bm-hero .bm-search-mega:focus-within { border-color: var(--gold-brand); }
  /* Chips on dark hero (Verified, Сургууль ойр, ...) */
  body[data-theme="warm"] .bm-hero .bm-chip {
    background: rgba(255,255,255,.06);
    border-color: rgba(255,255,255,.14);
    color: rgba(245,242,232,.85);
  }
  body[data-theme="warm"] .bm-hero .bm-chip:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.3); color: #F5F2E8; }
  body[data-theme="warm"] .bm-hero .bm-chip-icon-wrap { background: rgba(201,163,95,.18); }
  /* AI example chips below the search */
  body[data-theme="warm"] .bm-hero .ai-example,
  body[data-theme="warm"] .bm-hero button[onclick*="runAIExample"] {
    background: rgba(255,255,255,.05) !important;
    border-color: rgba(255,255,255,.14) !important;
    color: rgba(245,242,232,.82) !important;
  }
  body[data-theme="warm"] .bm-hero button[onclick*="runAIExample"]:hover {
    border-color: rgba(255,255,255,.3) !important; color: #F5F2E8 !important;
  }

  /* Stats panel is hard-locked to dark navy: keep text light inside it. */
  body[data-theme="warm"] .bm-stats-panel .bm-stat-val { color: #F5F2E8; }
  body[data-theme="warm"] .bm-stats-panel .bm-stat-label { color: rgba(245,242,232,.7); }
  body[data-theme="warm"] .bm-stats-panel h3,
  body[data-theme="warm"] .bm-stats-panel .text-lg { color: #F5F2E8; }
  body[data-theme="warm"] .bm-stats-panel .text-xs { color: rgba(245,242,232,.6) !important; }
  body[data-theme="warm"] .bm-stat-cell { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.08); }

  /* Footer is hard-locked to dark gradient: keep text light. */
  body[data-theme="warm"] .bm-footer { color: rgba(245,242,232,.78); }
  body[data-theme="warm"] .bm-footer-h { color: #F5F2E8; }
  body[data-theme="warm"] .bm-footer a { color: rgba(245,242,232,.78); }
  body[data-theme="warm"] .bm-footer a:hover { color: var(--gold-brand); }
  body[data-theme="warm"] .bm-footer .text-xs,
  body[data-theme="warm"] .bm-footer p,
  body[data-theme="warm"] .bm-footer span,
  body[data-theme="warm"] .bm-footer div { color: rgba(245,242,232,.78); }
  body[data-theme="warm"] .bm-footer .bm-footer-h,
  body[data-theme="warm"] .bm-footer strong,
  body[data-theme="warm"] .bm-footer .font-semibold,
  body[data-theme="warm"] .bm-footer .font-bold { color: #F5F2E8; }

  /* Hero cluster map is hard-locked dark: keep gold accents/text readable. */
  body[data-theme="warm"] .bm-cluster-label { color: rgba(245,242,232,.85); }

  /* Testimonial avatar text — gold on gold gradient = readable; nothing to do. */

  /* ============== Tweaks Panel ============== */
  .tweaks-panel {
    position: fixed; bottom: 80px; right: 16px; z-index: 95;
    width: 320px; max-width: calc(100vw - 32px);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 16px; box-shadow: 0 24px 64px rgba(0,0,0,.5);
    display: none; flex-direction: column; max-height: calc(100vh - 120px);
  }
  .tweaks-panel.open { display: flex; }
  .tweaks-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    cursor: grab;
  }
  .tweaks-head:active { cursor: grabbing; }
  .tweaks-body { padding: 16px 18px; overflow-y: auto; }
  .tweak-section + .tweak-section { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }
  .tweak-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); margin-bottom: 8px; }
  .tweak-radio { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tweak-radio button {
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-2, var(--bg)); color: var(--text-2); font-size: 13px; font-weight: 500;
    transition: all .15s;
  }
  .tweak-radio button:hover { color: var(--text); border-color: var(--border-strong); }
  .tweak-radio button.active { background: var(--primary); color: #0A1F44; border-color: var(--primary); font-weight: 600; }
  body[data-theme="warm"] .tweak-radio button.active { color: #0A1F44; }
  .tweak-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tweak-swatch {
    aspect-ratio: 1; border-radius: 10px; border: 2px solid transparent; padding: 4px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, transform .15s;
  }
  .tweak-swatch:hover { transform: scale(1.05); }
  .tweak-swatch.active { border-color: var(--text); }
  .tweak-swatch > span { width: 100%; height: 100%; border-radius: 6px; display: block; }
  .tweak-input {
    width: 100%; background: var(--bg-2, var(--bg)); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; font-size: 14px; color: var(--text);
    resize: vertical; font-family: inherit; line-height: 1.4;
  }
  .tweak-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .tweak-close {
    width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface-2); color: var(--text-2); transition: all .12s;
  }
  .tweak-close:hover { background: var(--border); color: var(--text); }

  /* ============== AI Search ============== */
  .ai-search {
    position: relative;
    background: var(--surface);
    border: 1.5px solid var(--border-strong);
    border-radius: 20px;
    padding: 4px;
    transition: border-color .2s, box-shadow .2s;
  }
  .ai-search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .ai-search-inner { display: flex; align-items: flex-end; gap: 8px; padding: 12px 14px; }
  .ai-search-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ai-search textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent;
    color: var(--text); font-size: 15px; line-height: 1.45; min-height: 24px;
    font-family: inherit; padding: 6px 0;
  }
  .ai-search textarea::placeholder { color: var(--text-3); }
  .ai-search-go { flex-shrink: 0; }
  .ai-examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; }
  .ai-example {
    font-size: 12px; padding: 6px 11px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border);
    transition: all .15s; cursor: pointer;
  }
  .ai-example:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .ai-extracted {
    margin-top: 12px; padding: 12px 14px;
    background: var(--primary-soft); border: 1px solid var(--primary);
    border-radius: 12px; font-size: 13px; color: var(--text);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .ai-extracted strong { color: var(--primary); }
  .ai-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.18); font-weight: 500; font-size: 12px; }
  body[data-theme="warm"] .ai-tag { background: rgba(255,255,255,.5); }

  /* ============== Lifestyle Chips ============== */
  .lifestyle-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .lifestyle-row::-webkit-scrollbar { display: none; }
  .lifestyle-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 13px; font-weight: 500; color: var(--text-2);
    cursor: pointer; flex-shrink: 0; transition: all .15s; white-space: nowrap;
  }
  .lifestyle-chip:hover { border-color: var(--primary); color: var(--text); }
  .lifestyle-chip.active {
    background: var(--primary); color: #0A1F44; border-color: var(--primary); font-weight: 600;
  }

  /* ============== Intelligence Card ============== */
  .intel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-radius: 12px; overflow: hidden; }
  .intel-cell { background: var(--surface); padding: 14px; }
  .intel-label { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
  .intel-value { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .intel-delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; margin-top: 4px; padding: 2px 6px; border-radius: 4px; }
  .intel-delta.below { background: var(--success-soft); color: var(--success); }
  .intel-delta.above { background: rgba(255,107,107,.12); color: var(--danger); }
  .intel-delta.fair { background: var(--surface-2); color: var(--text-2); }

  .trust-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
    background: var(--primary-soft); color: var(--primary);
    font-size: 11px; font-weight: 600; border: 1px solid var(--primary);
  }
  .trust-badge.muted { background: var(--surface-2); color: var(--text-3); border-color: var(--border); }

  .price-history { display: flex; align-items: flex-end; gap: 6px; height: 60px; padding: 8px 0; }
  .price-history-bar { flex: 1; background: var(--primary); border-radius: 3px 3px 0 0; min-height: 6px; transition: opacity .15s; }
  .price-history-bar:hover { opacity: .8; }
  .price-history-bar.last { background: var(--accent); }

  /* ============== Media Tabs (Property) ============== */
  .media-tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; gap: 2px; margin-bottom: 8px; }
  .media-tabs button {
    padding: 7px 12px; border-radius: 7px; font-size: 12px; font-weight: 500;
    color: var(--text-2); display: inline-flex; align-items: center; gap: 5px;
    transition: all .15s;
  }
  .media-tabs button:hover { color: var(--text); }
  .media-tabs button.active { background: var(--primary); color: #0A1F44; font-weight: 600; }
  .media-tabs button .pill-info { background: rgba(0,0,0,.15); color: inherit; font-size: 10px; padding: 1px 5px; }
  .media-frame { background: var(--surface-2); border-radius: 14px; overflow: hidden; position: relative; }
  .media-frame.floorplan {
    background:
      linear-gradient(135deg, #0F2148 0%, #06112B 100%);
    aspect-ratio: 16/9;
  }
  body[data-theme="warm"] .media-frame.floorplan { background: linear-gradient(135deg, #F0EDE3 0%, #DDD9CB 100%); }
  .fp-svg { width: 100%; height: 100%; display: block; }
  .media-tour, .media-video {
    aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 30% 30%, rgba(201,163,95,.12) 0%, transparent 50%),
      linear-gradient(135deg, #0F2148 0%, #06112B 100%);
    color: var(--text-2); flex-direction: column; gap: 12px; position: relative;
  }
  body[data-theme="warm"] .media-tour, body[data-theme="warm"] .media-video {
    background: radial-gradient(circle at 30% 30%, rgba(10,31,68,.08) 0%, transparent 50%), linear-gradient(135deg, #EFEDE4 0%, #DDD9CB 100%);
  }
  .media-play {
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--primary); color: #0A1F44;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 36px rgba(201,163,95,.4);
    transition: transform .15s;
  }
  .media-play:hover { transform: scale(1.06); }

  /* ============== View Toggle (results, mobile) ============== */
  .view-toggle { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .view-toggle button { padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--text-2); display: inline-flex; align-items: center; gap: 5px; transition: all .15s; }
  .view-toggle button.active { background: var(--primary); color: #0A1F44; font-weight: 600; }

  /* AI handoff highlight on agent contact */
  .ai-lead-banner {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--primary-soft); border: 1px solid var(--primary);
    font-size: 12px; color: var(--text); display: flex; gap: 8px; align-items: flex-start;
  }
  .ai-lead-banner i { color: var(--primary); flex-shrink: 0; margin-top: 2px; }

  /* ============== Map UX improvements ============== */
  /* Pin сонгогдсон/hover дүрс */
  .map-pin.dim { opacity: .35; }
  .map-pin.hovered { background: var(--primary); color: #0A1F44; border-color: var(--primary); transform: scale(1.06); }
  .map-pin .pin-idx {
    display: inline-block; margin-right: 5px; padding: 0 5px; border-radius: 4px;
    background: rgba(0,0,0,.18); font-size: 10px; font-variant-numeric: tabular-nums;
  }
  body[data-theme="warm"] .map-pin .pin-idx { background: rgba(255,255,255,.4); }
  .map-pin.selected .pin-idx, .map-pin.hovered .pin-idx { background: rgba(10,31,68,.15); }

  /* Numbered badge on list cards */
  .card-pin-badge {
    position: absolute; top: 10px; left: 10px;
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border-strong);
    color: var(--text); font-size: 11px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; box-shadow: 0 2px 6px rgba(0,0,0,.3); z-index: 2;
    transition: all .15s;
  }
  .prop-card.hovered .card-pin-badge,
  .prop-card.highlighted .card-pin-badge { background: var(--primary); color: #0A1F44; border-color: var(--primary); }
  .prop-card.dim { opacity: .55; }
  .prop-card.hovered { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 0 0 1px var(--primary), 0 16px 40px rgba(0,0,0,.4); }
  @keyframes card-flash { 0% { box-shadow: 0 0 0 0 var(--primary), 0 0 0 0 var(--primary-soft); } 60% { box-shadow: 0 0 0 3px var(--primary), 0 0 0 14px transparent; } 100% { box-shadow: none; } }
  .prop-card.flash { animation: card-flash 1.1s ease-out; }

  /* Map controls bar (top-right floating cluster) */
  .map-controls {
    position: absolute; top: 12px; right: 12px; z-index: 30;
    display: flex; flex-direction: column; gap: 6px;
  }
  .map-ctrl-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(8,22,58,.92); backdrop-filter: blur(10px);
    border: 1px solid var(--border-strong); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  .map-ctrl-btn:hover { background: var(--primary); color: #0A1F44; border-color: var(--primary); }
  body[data-theme="warm"] .map-ctrl-btn { background: rgba(255,255,255,.95); }

  /* Context badge — top-left chip showing current scope */
  .map-context {
    position: absolute; top: 12px; left: 12px; z-index: 30;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 999px;
    background: rgba(8,22,58,.92); backdrop-filter: blur(10px);
    border: 1px solid var(--border-strong); color: var(--text);
    font-size: 12px; font-weight: 500;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  body[data-theme="warm"] .map-context { background: rgba(255,255,255,.95); }
  .map-context .map-context-count {
    font-size: 11px; font-weight: 700; color: var(--primary);
    background: var(--primary-soft); padding: 2px 7px; border-radius: 999px;
  }
  .map-context .map-context-clear { color: var(--text-3); cursor: pointer; padding: 2px; }
  .map-context .map-context-clear:hover { color: var(--text); }

  /* Empty state overlay */
  .map-empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; pointer-events: none; z-index: 5;
    background: rgba(8,22,58,.6); backdrop-filter: blur(3px);
    color: var(--text-2); text-align: center; padding: 24px;
  }
  body[data-theme="warm"] .map-empty { background: rgba(255,255,255,.65); }

  /* Mobile map bottom-sheet preview */
  .map-sheet {
    position: absolute; bottom: 12px; left: 12px; right: 12px; z-index: 35;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 16px; padding: 12px; display: flex; gap: 12px; align-items: center;
    box-shadow: 0 -12px 36px rgba(0,0,0,.5);
    animation: sheet-up .22s ease;
  }
  @keyframes sheet-up { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .map-sheet-thumb { width: 72px; height: 72px; border-radius: 10px; background-size: cover; background-position: center; flex-shrink: 0; }
  .map-sheet-body { flex: 1; min-width: 0; }
  .map-sheet-price { font-size: 16px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
  .map-sheet-title { font-size: 13px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .map-sheet-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .map-sheet-close { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .map-sheet-go { background: var(--primary); color: #0A1F44; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

  /* Full-map override */
  .results-shell.full-map .results-aside-filters,
  .results-shell.full-map .results-list { display: none; }
  .results-shell.full-map .results-grid { display: block; }
  .results-shell.full-map .results-map-wrap { display: block; width: 100%; }

  /* Floating Save-search FAB */
  .save-search-fab {
    position: fixed; bottom: 96px; right: 20px; z-index: 60;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 999px;
    background: var(--primary); color: #0A1F44; font-size: 13px; font-weight: 600;
    box-shadow: 0 12px 32px rgba(201,163,95,.35), 0 4px 12px rgba(0,0,0,.3);
    cursor: pointer; transition: all .18s ease;
    animation: fab-pop .3s ease;
  }
  .save-search-fab:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(201,163,95,.45); }
  @keyframes fab-pop { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (max-width: 1024px) { .save-search-fab { bottom: 80px; right: 12px; left: 12px; justify-content: center; } }

  /* ============== Active filter chips bar ============== */
  .active-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 6px 6px 11px; border-radius: 999px;
    background: var(--primary-soft); color: var(--primary);
    border: 1px solid var(--primary);
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .active-chip .active-chip-x {
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,.18); display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .12s;
  }
  body[data-theme="warm"] .active-chip .active-chip-x { background: rgba(255,255,255,.5); }
  .active-chip .active-chip-x:hover { background: var(--primary); color: var(--text); }
  .active-chip-clear-all {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 12px; border-radius: 999px;
    background: transparent; color: var(--text-3); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: color .15s;
  }
  .active-chip-clear-all:hover { color: var(--danger); }

  /* Recently-viewed visual */
  .prop-card.viewed { opacity: .75; }
  .prop-card.viewed:hover { opacity: 1; }
  .viewed-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    background: rgba(8,22,58,.85); backdrop-filter: blur(6px);
    color: var(--text-2); font-size: 10px; font-weight: 600; letter-spacing: .04em;
  }
  body[data-theme="warm"] .viewed-badge { background: rgba(255,255,255,.85); }
  .map-pin.viewed { opacity: .55; }
  .map-pin.viewed::after {
    content: "✓"; position: absolute; top: -6px; right: -6px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--gold); color: #0A1F44; font-size: 9px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  /* Map mode toggle (pins vs heatmap) — within map controls */
  .map-mode-toggle {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 28;
    display: inline-flex; background: rgba(8,22,58,.92); backdrop-filter: blur(10px);
    border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px; gap: 2px;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  body[data-theme="warm"] .map-mode-toggle { background: rgba(255,255,255,.95); }
  .map-mode-toggle button {
    padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 600;
    color: var(--text-2); display: inline-flex; align-items: center; gap: 5px;
    transition: all .15s;
  }
  .map-mode-toggle button:hover { color: var(--text); }
  .map-mode-toggle button.active { background: var(--primary); color: #0A1F44; }

  /* Heatmap district polygons */
  .map-zone.heat-1 { fill: rgba(77,208,158,.22); stroke: rgba(77,208,158,.5); }
  .map-zone.heat-2 { fill: rgba(201,163,95,.22); stroke: rgba(201,163,95,.55); }
  .map-zone.heat-3 { fill: rgba(240,182,80,.22); stroke: rgba(240,182,80,.55); }
  .map-zone.heat-4 { fill: rgba(10,31,68,.22); stroke: rgba(10,31,68,.55); }
  .map-zone.heat-5 { fill: rgba(255,107,107,.28); stroke: rgba(255,107,107,.6); }
  .map-shell.heatmap-on .map-zone { stroke-dasharray: none; }
  .heatmap-legend {
    position: absolute; bottom: 12px; left: 12px; z-index: 28;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 12px;
    background: rgba(8,22,58,.92); backdrop-filter: blur(10px);
    border: 1px solid var(--border-strong); color: var(--text);
    font-size: 11px; box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  body[data-theme="warm"] .heatmap-legend { background: rgba(255,255,255,.95); }
  .heatmap-legend-bar {
    display: inline-flex; height: 8px; width: 90px; border-radius: 4px; overflow: hidden;
    background: linear-gradient(90deg, rgba(77,208,158,.7) 0%, rgba(201,163,95,.7) 25%, rgba(240,182,80,.7) 50%, rgba(10,31,68,.7) 75%, rgba(255,107,107,.85) 100%);
  }

  /* On hover dim other pins for focus */
  .map-shell.has-hover .map-pin:not(.hovered):not(.selected) { opacity: .4; }
  .map-shell.has-hover .map-pin.selected { opacity: 1; }

  /* ============== BAIRMAP — NEW DESIGN COMPONENTS ============== */

  /* Top nav */
  .bm-nav {
    padding: 8px 16px;
    border-radius: 8px;
    color: var(--text-2);
    font-weight: 500;
    transition: color .15s, background .15s;
    position: relative;
  }
  .bm-nav:hover { color: var(--text); }
  .bm-nav.active { color: var(--gold-brand); }
  .bm-nav.active::after {
    content: ""; position: absolute; left: 16px; right: 16px; bottom: -4px;
    height: 2px; background: var(--gold-brand); border-radius: 2px;
  }
  .bm-nav-ai {
    background: linear-gradient(135deg, rgba(201,163,95,.18), rgba(201,163,95,.06));
    color: var(--gold-brand) !important;
    border: 1px solid rgba(201,163,95,.25);
  }
  .bm-nav-ai:hover { background: linear-gradient(135deg, rgba(201,163,95,.28), rgba(201,163,95,.12)); }

  .btn-signin {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 10px;
    background: transparent; color: var(--text);
    border: 1px solid var(--border-strong);
    font-size: 14px; font-weight: 500;
    transition: all .15s;
  }
  .btn-signin:hover { background: var(--surface-2); border-color: var(--gold-brand); color: var(--gold-brand); }

  /* ===== HOME HERO ===== */
  .bm-hero {
    background:
      linear-gradient(180deg, rgba(6,17,43,.78) 0%, rgba(10,26,60,.70) 55%, rgba(14,33,80,.85) 100%),
      url('uploads/hero-bg.png');
    background-size: cover;
    background-position: center 60%;
    background-repeat: no-repeat;
    position: relative; overflow: hidden;
  }
  .bm-hero::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(ellipse 700px 400px at 80% 25%, rgba(201,163,95,.18) 0%, transparent 60%),
      radial-gradient(ellipse 600px 500px at 15% 90%, rgba(10,31,68,.35) 0%, transparent 65%);
    pointer-events: none;
  }
  /* Bottom fade so the search bar reads clearly on the photo. */
  .bm-hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 0%, transparent 50%, rgba(6,17,43,.45) 100%);
    pointer-events: none;
  }
  .bm-hero > * { position: relative; z-index: 1; }
  .bm-hero-title {
    font-size: clamp(32px, 4.8vw, 56px);
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.05;
    color: var(--text);
  }
  .bm-hero-title .gold { color: var(--gold-brand); }
  .bm-hero-sub {
    color: var(--text-2);
    font-size: 16px;
    line-height: 1.55;
    max-width: 480px;
  }

  /* ===== Mini district cluster map (hero right) — Улаанбаатарын схем зураг ===== */
  .bm-cluster-map {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    border-radius: 20px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 25% 30%, rgba(201,163,95,.10) 0%, transparent 38%),
      radial-gradient(ellipse at 75% 70%, rgba(201,163,95,.06) 0%, transparent 42%),
      radial-gradient(ellipse at 50% 50%, rgba(20,40,85,.5) 0%, transparent 60%),
      linear-gradient(135deg, #07142F 0%, #0D1F44 50%, #142855 100%);
    border: 1px solid var(--border-strong);
    box-shadow: 0 20px 60px rgba(0,0,0,.55), inset 0 0 60px rgba(0,0,0,.3);
  }
  /* Subtle blueprint grid */
  .bm-cluster-map::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(201,163,95,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,163,95,.04) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 90%);
  }
  /* SVG road / river network — sits between background and pins */
  .bm-cluster-svg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  .bm-cluster-svg .road { stroke: rgba(245,242,232,.10); fill: none; stroke-linecap: round; }
  .bm-cluster-svg .road.main { stroke: rgba(245,242,232,.18); stroke-width: 2.2; }
  .bm-cluster-svg .road.ring { stroke: rgba(201,163,95,.18); stroke-width: 1.6; stroke-dasharray: 4 3; }
  .bm-cluster-svg .river { stroke: rgba(80,160,220,.35); stroke-width: 5; fill: none; stroke-linecap: round; filter: blur(.5px); }
  .bm-cluster-svg .river-soft { stroke: rgba(80,160,220,.18); stroke-width: 12; fill: none; stroke-linecap: round; filter: blur(4px); }

  /* District map labels (faint) */
  .bm-cluster-rgn {
    position: absolute; transform: translate(-50%,-50%);
    font-size: 9px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(245,242,232,.18); pointer-events: none;
    font-family: ui-monospace, 'SF Mono', monospace;
    z-index: 2;
  }

  /* Cluster pin */
  .bm-cluster {
    position: absolute; transform: translate(-50%,-50%);
    z-index: 4;
  }
  .bm-cluster-pin {
    position: relative;
    background: linear-gradient(135deg, #DDB874 0%, #C9A35F 50%, #B08B47 100%);
    color: #0A1F44;
    font-weight: 700; font-size: 14px;
    padding: 9px 16px;
    border-radius: 100px;
    box-shadow:
      0 4px 12px rgba(201,163,95,.45),
      0 0 0 4px rgba(201,163,95,.12),
      inset 0 1px 1px rgba(255,255,255,.35);
    cursor: pointer;
    transition: transform .25s ease, box-shadow .25s ease;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,.18);
  }
  @keyframes cluster-pulse {
    0%, 100% { box-shadow:
      0 4px 12px rgba(201,163,95,.4),
      0 0 0 4px rgba(201,163,95,.12),
      0 0 0 8px rgba(201,163,95,.0),
      inset 0 1px 1px rgba(255,255,255,.35); }
    50%      { box-shadow:
      0 4px 14px rgba(201,163,95,.55),
      0 0 0 4px rgba(201,163,95,.18),
      0 0 0 12px rgba(201,163,95,.05),
      inset 0 1px 1px rgba(255,255,255,.4); }
  }
  .bm-cluster-pin { animation: cluster-pulse 2.6s ease-in-out infinite; }
  .bm-cluster:hover .bm-cluster-pin {
    transform: scale(1.12);
    box-shadow:
      0 8px 24px rgba(201,163,95,.6),
      0 0 0 6px rgba(201,163,95,.18),
      inset 0 1px 1px rgba(255,255,255,.45);
  }
  .bm-cluster-label {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    margin-top: 8px;
    font-size: 12px; color: var(--text-2); font-weight: 500;
    white-space: nowrap;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
    pointer-events: none;
  }
  .bm-cluster:hover .bm-cluster-label { color: var(--gold-brand); }

  /* Hover preview card — appears next to cluster pin on hover */
  .bm-cluster-preview {
    position: absolute; left: calc(100% + 14px); top: 50%; transform: translateY(-50%) translateX(-8px);
    width: 200px;
    background: rgba(8,18,38,.96);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 16px 40px rgba(0,0,0,.55);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 30;
  }
  .bm-cluster:hover .bm-cluster-preview { opacity: 1; transform: translateY(-50%) translateX(0); }
  .bm-cluster.flip-left .bm-cluster-preview { left: auto; right: calc(100% + 14px); transform: translateY(-50%) translateX(8px); }
  .bm-cluster.flip-left:hover .bm-cluster-preview { transform: translateY(-50%) translateX(0); }
  .bm-cluster-preview-photo {
    height: 70px; border-radius: 8px;
    background-size: cover; background-position: center;
    background-color: var(--surface-2);
    margin-bottom: 8px;
    position: relative;
  }
  .bm-cluster-preview-tag {
    position: absolute; top: 6px; left: 6px;
    padding: 2px 7px; border-radius: 6px;
    background: rgba(8,18,38,.85); color: var(--gold-brand);
    font-size: 9px; font-weight: 700;
  }
  .bm-cluster-preview-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .bm-cluster-preview-meta { font-size: 10px; color: var(--text-3); margin-bottom: 4px; }
  .bm-cluster-preview-price { font-size: 13px; font-weight: 700; color: var(--gold-brand); }

  /* Floating featured card (bottom-right corner of the map) */
  .bm-cluster-feature {
    position: absolute;
    bottom: 14px; right: 14px;
    width: 180px;
    background: rgba(8,18,38,.92);
    backdrop-filter: blur(10px);
    border: 1px solid var(--gold-brand);

  /* Category tabs (Худалдах/Түрээслэх/Оффис/Газар/Төсөл) */

  /* Horizontal listing row variant (results page) */
  .bm-listing-row {

  .bm-prop-title { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }

  .bm-prop-spec {

  .bm-btn-gold { background: var(--gold-brand); color: #0A1F44; font-weight: 600; padding: 12px 18px; border-radius: 10px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; transition: background .15s; }

  /* AI reason card */
  .bm-ai-reason {

<!-- ========== TWEAKS PANEL ========== -->
<div class="tweaks-panel" id="tweaks-panel" role="dialog" aria-label="Tweaks">
  <div class="tweaks-head">
    <div>
      <div style="font-weight:600; font-size:14px;">Tweaks</div>
      <div style="font-size:11px; color:var(--text-3); margin-top:2px;">Reshape the feel</div>
    </div>
    <button onclick="dismissTweaks()" class="tweak-close" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="tweaks-body" id="tweaks-body"></div>
</div>

<script>
(function () {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "spartan",
    "accent": "gold",
    "heroTitle": "Таны мөрөөдлийн\nүл хөдлөхийг олох зам."
  }/*EDITMODE-END*/;

  // Accent palettes — picks how every primary thing looks.
  // Each entry is { primary, primaryDark, primarySoftRgba, glowRgba, fgOnPrimary, label }.
  const ACCENTS = {
    gold:    { primary: '#C9A35F', primaryDark: '#B08B47', soft: 'rgba(201,163,95,.14)', glow: 'rgba(201,163,95,.25)', fg: '#0A1F44', label: 'Brand Gold' },
    navy:    { primary: '#0A1F44', primaryDark: '#051028', soft: 'rgba(10,31,68,.12)',   glow: 'rgba(10,31,68,.25)',   fg: '#F5F2E8', label: 'Brand Navy' },
    champagne:{primary: '#E0C68C', primaryDark: '#C9AB6A', soft: 'rgba(224,198,140,.16)', glow: 'rgba(224,198,140,.25)', fg: '#0A1F44', label: 'Champagne' },
    bronze:  { primary: '#A8854B', primaryDark: '#8A6D3D', soft: 'rgba(168,133,75,.14)', glow: 'rgba(168,133,75,.22)', fg: '#F5F2E8', label: 'Bronze' }
  };

  const tweaks = Object.assign({}, TWEAK_DEFAULTS);
  // Local light/dark preference — overrides default if user has toggled before
  try {
    const saved = localStorage.getItem('neo-theme');
    if (saved === 'warm' || saved === 'spartan') tweaks.theme = saved;
  } catch (e) {}

  // Apply tweaks to the DOM — runs on init AND on every change
  function applyTweaks() {
    // 1) Theme
    document.body.setAttribute('data-theme', tweaks.theme === 'warm' ? 'warm' : 'spartan');
    // Sync header toggle icon — sun in light mode (click to go dark), moon in dark
    const ticon = document.getElementById('theme-toggle-icon');
    if (ticon) {
      ticon.setAttribute('data-lucide', tweaks.theme === 'warm' ? 'sun' : 'moon');
      if (window.lucide) lucide.createIcons();
    }

    // 2) Accent palette — override CSS vars at :root
    const a = ACCENTS[tweaks.accent] || ACCENTS.gold;
    const root = document.documentElement.style;
    root.setProperty('--primary', a.primary);
    root.setProperty('--primary-dark', a.primaryDark);
    root.setProperty('--primary-soft', a.soft);
    root.setProperty('--shadow-glow', '0 0 40px ' + a.glow);

    // Update btn primary text color so light-on-light doesn't happen
    // (CSS uses fixed color on .btn-primary; rewrite via inline style on body for cascade)
    document.body.style.setProperty('--btn-on-primary', a.fg);

    // 3) Hero title — surface to app state so renderHome reads it
    if (window.state) window.state.heroTitle = tweaks.heroTitle;
    // If on home page, re-render so headline updates
    if (window.currentScreen === 'home' && typeof renderAppScreen === 'function') {
      renderAppScreen('home');
      if (window.lucide) setTimeout(() => lucide.createIcons(), 0);
    }

    renderPanel();
  }

  function setTweak(key, value) {
    tweaks[key] = value;
    applyTweaks();
    // Persist via parent host
    try {
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: value } }, '*');
    } catch (e) {}
  }
  window.setTweak = setTweak;

  // Header light/dark toggle
  window.toggleTheme = function () {
    tweaks.theme = tweaks.theme === 'warm' ? 'spartan' : 'warm';
    try { localStorage.setItem('neo-theme', tweaks.theme); } catch (e) {}
    applyTweaks();
  };

  function renderPanel() {
    const body = document.getElementById('tweaks-body');
    if (!body) return;
    body.innerHTML = `
      <div class="tweak-section">
        <div class="tweak-label">Visual mode</div>
        <div class="tweak-radio">
          <button class="${tweaks.theme==='spartan'?'active':''}" onclick="setTweak('theme','spartan')">Navy</button>
          <button class="${tweaks.theme==='warm'?'active':''}" onclick="setTweak('theme','warm')">Ivory</button>
        </div>
        <div style="font-size:11px; color:var(--text-3); margin-top:8px; line-height:1.4;">
          ${tweaks.theme==='spartan'
            ? 'Гүн навигийн фон, алтан акцент. Premium luxury feel.'
            : 'Цэвэр өнгийн фон, навигийн текст, алтан акцент. Brand identity.'}
        </div>
      </div>

      <div class="tweak-section">
        <div class="tweak-label">Accent</div>
        <div class="tweak-swatches">
          ${Object.entries(ACCENTS).map(([k, v]) => `
            <button class="tweak-swatch ${tweaks.accent===k?'active':''}" onclick="setTweak('accent','${k}')" aria-label="${v.label}">
              <span style="background:${v.primary}"></span>
            </button>
          `).join('')}
        </div>
      </div>

      <div class="tweak-section">
        <div class="tweak-label">Hero headline</div>
        <textarea class="tweak-input" rows="2" oninput="setTweak('heroTitle', this.value)" placeholder="Гарчгаа бичээрэй...">${tweaks.heroTitle}</textarea>
        <div style="font-size:11px; color:var(--text-3); margin-top:6px;">Enter = шинэ мөр. Эхний хуудсан дээр шууд гарна.</div>
      </div>
    `;
  }

  // ---------- Protocol ----------
  // Register listener FIRST, then announce availability
  window.addEventListener('message', (e) => {
    if (!e.data || !e.data.type) return;
    if (e.data.type === '__activate_edit_mode') {
      document.getElementById('tweaks-panel').classList.add('open');
      renderPanel();
    } else if (e.data.type === '__deactivate_edit_mode') {
      document.getElementById('tweaks-panel').classList.remove('open');
    }
  });

  window.dismissTweaks = function () {
    document.getElementById('tweaks-panel').classList.remove('open');
    try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch (e) {}
  };

  // Apply immediately on boot so saved values take effect
  applyTweaks();

  // Now announce availability
  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch (e) {}
})();
</script>
